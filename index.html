<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المنتجات - إدارة الأسعار</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة الباركود الحديثة والسريعة -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --primary: #2980b9;
            --bg-body: #E2E8F0;
            --card-bg: linear-gradient(135deg, #FFFFFF 0%, #F1F5F9 100%);
            --input-bg: #FFFFFF;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --danger: #f43f5e;
            --border-color: #cbd5e1;
            --stats-bg: #f8fafc;
        }

        body.dark-mode {
            --bg-body: #0f172a !important;
            --card-bg: linear-gradient(135deg, #1e293b 0%, #0f172a 100%) !important;
            --input-bg: #1e293b !important;
            --text-main: #f8fafc !important;
            --text-muted: #94a3b8 !important;
            --border-color: #334155 !important;
            --stats-bg: #1e293b !important;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 620px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 22px;
            box-shadow: 0 20px 40px -10px rgba(41, 128, 185, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.1);
            position: relative;
            padding-top: 50px !important;
        }

        .theme-toggle {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--stats-bg);
            border: 2px solid var(--border-color);
            color: var(--text-main);
            width: 45px;
            height: 45px;
            border-radius: 0 22px 0 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            z-index: 10;
        }

        h2 {
            text-align: center;
            color: var(--text-main);
            margin-bottom: 20px;
            font-size: 26px;
            font-weight: 900;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: var(--stats-bg);
            padding: 6px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--border-color);
            border: 2px solid transparent;
            border-radius: 10px;
            font-family: 'Tajawal', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            color: var(--text-main);
            transition: all 0.25s ease;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--primary) !important;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(41, 128, 185, 0.25);
        }

        .section-content { display: none; }
        .section-content.active { display: block; }

        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            color: var(--text-main);
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            box-sizing: border-box;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-family: 'Tajawal', sans-serif;
            font-size: 15px;
            outline: none;
            background-color: var(--input-bg);
            color: var(--text-main);
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(41, 128, 185, 0.15); }

        .barcode-container { display: flex; gap: 10px; }
        .barcode-container input { flex: 1; }

        .btn-qr-scan {
            background: var(--primary);
            color: #ffffff;
            border: 2px solid transparent;
            padding: 0 16px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            font-size: 13px;
            height: 48px;
            box-shadow: 0 4px 12px rgba(41, 128, 185, 0.2);
            white-space: nowrap;
        }
        .btn-qr-scan svg { width: 18px; height: 18px; fill: currentColor; }

        .btn-save {
            background: var(--primary);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: 800;
            box-shadow: 0 8px 20px rgba(41, 128, 185, 0.25);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: var(--stats-bg);
            border: 2px solid var(--border-color);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-weight: 900;
        }

        .stat-card span { display: block; font-size: 14px; color: var(--text-muted); margin-bottom: 4px; }
        .stat-card strong { font-size: 18px; color: var(--primary); }

        .floating-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .btn-delete-selected, .btn-select-all {
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-size: 13px;
            font-weight: 700;
            display: none;
        }
        .btn-delete-selected { background-color: var(--danger); color: white; }
        .btn-select-all { background-color: var(--primary); color: white; }

        .product-card {
            background: var(--input-bg);
            border: 2px solid var(--border-color);
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .product-card:hover { border-color: var(--primary); transform: translateY(-1px); }

        .product-card input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .product-thumb {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border-radius: 10px;
            background: var(--stats-bg);
            border: 1px solid var(--border-color);
        }

        .product-info { flex: 1; }
        .product-info h4 { margin: 0 0 4px 0; color: var(--primary); font-size: 17px; font-weight: 700; }
        .product-price-txt { margin: 3px 0; font-size: 14px; color: var(--text-main); }
        .product-price-txt strong { color: #10b981; font-size: 16px; font-weight: 800; }
        .product-barcode-txt { margin: 0; font-size: 13px; color: var(--text-muted); }

        .actions-group { display: flex; flex-direction: column; gap: 6px; }

        .btn-edit, .btn-delete {
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-size: 12px;
            font-weight: 700;
        }
        .btn-edit { background-color: #10b981; color: #ffffff; }
        .btn-delete { background-color: var(--danger); color: #ffffff; }

        .viewport {
            width: 100%;
            display: none;
            position: relative;
            margin-bottom: 12px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 22px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            border: 2px solid var(--border-color);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            color: var(--text-muted);
        }

        .modal-img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            margin: 15px auto;
            display: block;
            border-radius: 12px;
            background: var(--stats-bg);
            padding: 10px;
            border: 1px solid var(--border-color);
        }

        #toast {
            visibility: hidden;
            min-width: 220px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            text-align: center;
            border-radius: 12px;
            padding: 12px;
            position: fixed;
            z-index: 1000;
            right: 25px;
            bottom: 25px;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(15px);
        }
        #toast.show { visibility: visible; opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

<div class="container">
    <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">🌙</button>
    <h2>لوحة تحكم المنتجات</h2>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('add')">إضافة منتج جديد</button>
        <button class="tab-btn" onclick="switchTab('search')">استعلام شامل</button>
        <button class="tab-btn" onclick="switchTab('updates')">الأسعار الجديدة 🔔</button>
    </div>

    <!-- قسم الإضافة -->
    <div id="addSection" class="section-content active">
        <input type="hidden" id="editingId" value="">
        
        <div class="form-group">
            <label>اسم المنتج</label>
            <input type="text" id="productName" placeholder="أدخل اسم المنتج هنا...">
        </div>

        <div class="form-group">
            <label>السعر (بالجنيه)</label>
            <input type="number" id="productPrice" placeholder="أدخل السعر...">
        </div>

        <div class="form-group">
            <label>رفع صورة المنتج</label>
            <div style="display: flex; gap: 10px; align-items: center;">
                <input type="file" id="productImage" accept="image/*" capture="environment" style="display: none;" onchange="updateImageFileName(this)">
                <button type="button" class="btn-qr-scan" onclick="document.getElementById('productImage').click()" style="flex: 1; height: 48px; justify-content: center;">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M4 5h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm8 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0-2a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>
                    اختر أو التقط صورة المنتج
                </button>
            </div>
            <div id="imageFileName" style="font-size: 12px; color: var(--text-muted); margin-top: 5px;"></div>
        </div>

        <div class="form-group">
            <label>الباركود أو الـ QR Code</label>
            <div class="barcode-container">
                <input type="text" id="productBarcode" placeholder="امسح الرمز أو اكتبه...">
                <button type="button" class="btn-qr-scan" onclick="toggleScanner('reader', 'productBarcode')">
                    <svg viewBox="0 0 24 24"><path d="M2,2H10V10H2V2M4,4V8H8V4H4M14,2H22V10H14V2M16,4V8H20V4H16M2,14H10V22H2V14M4,16V20H8V16H4M18,14V18H22V14H18M14,18H16V22H14V18M20,18H22V22H20V18M12,2H14V6H12V2M12,8H14V12H12V8M12,14H14V18H12V14M12,20H14V22H12V20M6,6H6.01V6.01H6V6M18,6H18.01V6.01H18V6M6,18H6.01V6.01H6V18Z"/></svg>
                    QR Scan
                </button>
            </div>
        </div>

        <div id="reader" class="viewport"></div>
        <button type="button" class="btn-save" onclick="saveProduct()">حفظ المنتج</button>
    </div>

    <!-- سجل الأسعار الجديدة -->
    <div id="updatesSection" class="section-content">
        <h3 style="text-align: center; margin-bottom: 15px;">سجل آخر تعديلات وتغيرات الأسعار</h3>
        <div id="updatesList" style="display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto;"></div>
    </div>

    <!-- الاستعلام الشامل -->
    <div id="searchSection" class="section-content">
        <div class="stats-grid">
            <div class="stat-card">
                <span>إجمالي المنتجات</span>
                <strong id="statTotal">0</strong>
            </div>
            <div class="stat-card">
                <span>أعلى سعر</span>
                <strong id="statMax">0 ج.م</strong>
            </div>
        </div>

        <div class="floating-actions">
            <button type="button" id="selectAllBtn" class="btn-select-all" onclick="toggleSelectAll()">تحديد الكل</button>
            <button type="button" id="deleteSelectedBtn" class="btn-delete-selected" onclick="deleteSelectedProducts()">حذف المحددين</button>
        </div>

        <div class="form-group">
            <label>ابحث بالاسم، السعر، أو الـ QR Code</label>
            <div class="barcode-container">
                <input type="text" id="searchInput" placeholder="ابحث عن منتجات..." oninput="searchProducts()">
                <button type="button" class="btn-qr-scan" onclick="toggleScanner('searchReader', 'searchInput', true)">
                    <svg viewBox="0 0 24 24"><path d="M2,2H10V10H2V2M4,4V8H8V4H4M14,2H22V10H14V2M16,4V8H20V4H16M2,14H10V22H2V14M4,16V20H8V16H4M18,14V18H22V14H18M14,18H16V22H14V18M20,18H22V22H20V18M12,2H14V6H12V2M12,8H14V12H12V8M12,14H14V18H12V14M12,20H14V22H12V20M6,6H6.01V6.01H6V6M18,6H18.01V6.01H18V6M6,18H6.01V6.01H6V18Z"/></svg>
                    QR Scan
                </button>
            </div>
        </div>

        <div id="searchReader" class="viewport"></div>
        <div id="resultsList"></div>
    </div>
</div>

<!-- Modal التأكيد -->
<div id="confirmModal" class="modal">
    <div class="modal-content" style="max-width: 320px;" onclick="event.stopPropagation()">
        <h3 style="font-size: 18px; margin-bottom: 10px;">تأكيد الحذف</h3>
        <p id="confirmMessage" style="color: var(--text-muted); margin-bottom: 20px; font-size: 14px;"></p>
        <div style="display: flex; gap: 10px;">
            <button type="button" id="confirmYesBtn" style="flex: 1; background: var(--danger); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer;">نعم، حذف</button>
            <button type="button" onclick="closeConfirmModal()" style="flex: 1; background: var(--border-color); color: var(--text-main); border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer;">إلغاء</button>
        </div>
    </div>
</div>

<!-- Modal عرض التفاصيل -->
<div id="productModal" class="modal" onclick="closeProductModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-modal" onclick="closeProductModal()">&times;</span>
        <img id="modalImg" class="modal-img" src="" alt="صورة">
        <h3 id="modalName" style="font-size: 20px; font-weight: 900; margin: 10px 0;"></h3>
        <div id="modalPrice" style="font-size: 18px; font-weight: 800; color: #10b981; margin-bottom: 10px;"></div>
        <div id="modalBarcode" style="font-size: 14px; color: var(--text-muted);"></div>
    </div>
</div>

<div id="toast">تم بنجاح</div>

<script>
function playBeep() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
    } catch (e) {}
}

function toggleTheme() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    document.getElementById('themeToggleBtn').textContent = isDark ? '☀️' : '🌙';
}

window.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
        document.getElementById('themeToggleBtn').textContent = '☀️';
    }
    loadProducts();
    loadPriceUpdates();
});

function showToast(msg, isSuccess = true) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.background = isSuccess ? 'linear-gradient(135deg, #10b981, #059669)' : 'linear-gradient(135deg, #f43f5e, #e11d48)';
    toast.className = "show";
    playBeep();
    setTimeout(() => toast.className = "", 3000);
}

function switchTab(tab) {
    // إيقاف الكاميرات عند التنقل بين التبويبات لتجنب الأخطاء
    stopCurrentScanner();

    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.section-content').forEach(s => { s.classList.remove('active'); s.style.display = 'none'; });

    if (tab === 'add') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('addSection').classList.add('active');
        document.getElementById('addSection').style.display = 'block';
    } else if (tab === 'search') {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('searchSection').classList.add('active');
        document.getElementById('searchSection').style.display = 'block';
        loadProducts();
    } else if (tab === 'updates') {
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        document.getElementById('updatesSection').classList.add('active');
        document.getElementById('updatesSection').style.display = 'block';
        loadPriceUpdates();
    }
}

function getProducts() { return JSON.parse(localStorage.getItem('smart_products') || '[]'); }
function saveProducts(p) { localStorage.setItem('smart_products', JSON.stringify(p)); updateStats(p); }

function updateStats(products) {
    document.getElementById('statTotal').textContent = products.length;
    let max = 0;
    products.forEach(p => { if (parseFloat(p.price) > max) max = parseFloat(p.price); });
    document.getElementById('statMax').textContent = max + ' ج.م';
}

function saveProduct() {
    const id = document.getElementById('editingId').value;
    const name = document.getElementById('productName').value.trim();
    const price = document.getElementById('productPrice').value.trim();
    const barcode = document.getElementById('productBarcode').value.trim() || 'بدون باركود';
    const imageInput = document.getElementById('productImage');

    if (!name || !price) {
        showToast('من فضلك ادخل اسم المنتج والسعر!', false);
        return;
    }

    let products = getProducts();

    const proceed = (img) => {
        if (id) {
            const old = products.find(p => p.id == id);
            const priceChanged = old && parseFloat(old.price) !== parseFloat(price);

            products = products.map(p => p.id == id ? { id: Number(id), name, price, barcode, image: img || p.image || '' } : p);

            if (priceChanged) {
                let updates = JSON.parse(localStorage.getItem('price_updates_list') || '[]');
                updates.unshift({
                    updateId: Date.now() + Math.random(),
                    productId: Number(id),
                    name,
                    image: img || old.image || '',
                    oldPrice: old.price,
                    price,
                    barcode
                });
                localStorage.setItem('price_updates_list', JSON.stringify(updates));
            }
            document.getElementById('editingId').value = '';
            showToast('تم تعديل المنتج بنجاح!');
        } else {
            products.push({ id: Date.now(), name, price, barcode, image: img || '' });
            showToast('تم حفظ المنتج بنجاح!');
        }

        document.getElementById('productName').value = '';
        document.getElementById('productPrice').value = '';
        document.getElementById('productBarcode').value = '';
        document.getElementById('productImage').value = '';
        document.getElementById('imageFileName').textContent = '';
        
        saveProducts(products);
        loadProducts();
    };

    if (imageInput.files && imageInput.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => proceed(e.target.result);
        reader.readAsDataURL(imageInput.files[0]);
    } else {
        proceed(null);
    }
}

function loadProducts() {
    const products = getProducts();
    updateStats(products);
    displayProducts(products);
}

function displayProducts(products) {
    const list = document.getElementById('resultsList');
    const selectAllBtn = document.getElementById('selectAllBtn');

    if (products.length > 2) {
        selectAllBtn.style.display = 'block';
    } else {
        selectAllBtn.style.display = 'none';
    }

    if (products.length === 0) {
        list.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 20px;">لا توجد منتجات.</p>';
        toggleDeleteSelectedBtn();
        return;
    }

    let html = '';
    products.forEach(p => {
        html += `
            <div class="product-card" onclick="openProductModal(${p.id})">
                <input type="checkbox" class="product-checkbox" data-id="${p.id}" onclick="event.stopPropagation()" onchange="toggleDeleteSelectedBtn()">
                <img src="${p.image || 'https://via.placeholder.com/60?text=No+Img'}" class="product-thumb">
                <div class="product-info">
                    <h4>${p.name}</h4>
                    <p class="product-price-txt">السعر: <strong>${p.price} ج.م</strong></p>
                    <p class="product-barcode-txt">الباركود: ${p.barcode}</p>
                </div>
                <div class="actions-group" onclick="event.stopPropagation()">
                    <button class="btn-edit" onclick="editProduct(${p.id})">تعديل</button>
                    <button class="btn-delete" onclick="deleteProduct(${p.id})">حذف</button>
                </div>
            </div>
        `;
    });
    list.innerHTML = html;
    toggleDeleteSelectedBtn();
}

function searchProducts() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const products = getProducts();
    displayProducts(products.filter(p => p.name.toLowerCase().includes(q) || p.price.toString().includes(q) || p.barcode.toLowerCase().includes(q)));
}

function editProduct(id) {
    const p = getProducts().find(item => item.id == id);
    if (!p) return;
    document.getElementById('editingId').value = p.id;
    document.getElementById('productName').value = p.name;
    document.getElementById('productPrice').value = p.price;
    document.getElementById('productBarcode').value = p.barcode;
    switchTab('add');
    showToast('جاري وضع التعديل...');
}

let confirmCallback = null;
function showConfirm(msg, cb) {
    document.getElementById('confirmMessage').textContent = msg;
    document.getElementById('confirmModal').style.display = 'flex';
    confirmCallback = cb;
}
function closeConfirmModal() {
    document.getElementById('confirmModal').style.display = 'none';
    confirmCallback = null;
}
document.getElementById('confirmYesBtn').onclick = () => { if (confirmCallback) confirmCallback(); closeConfirmModal(); };

function deleteProduct(id) {
    showConfirm("هل أنت متأكد من حذف هذا المنتج؟ سيتم إزالته نهائياً.", () => {
        let products = getProducts().filter(p => p.id != id);
        saveProducts(products);

        let updates = JSON.parse(localStorage.getItem('price_updates_list') || '[]').filter(u => u.productId !== Number(id));
        localStorage.setItem('price_updates_list', JSON.stringify(updates));

        loadProducts();
        loadPriceUpdates();
        showToast("تم الحذف بنجاح!", false);
    });
}

function toggleSelectAll() {
    const cbs = document.querySelectorAll('.product-checkbox');
    const allChecked = Array.from(cbs).every(cb => cb.checked);
    cbs.forEach(cb => cb.checked = !allChecked);
    toggleDeleteSelectedBtn();
}

function toggleDeleteSelectedBtn() {
    const checked = document.querySelectorAll('.product-checkbox:checked');
    const total = document.querySelectorAll('.product-checkbox');
    
    document.getElementById('deleteSelectedBtn').style.display = checked.length > 0 ? 'block' : 'none';
    
    if(total.length > 2) {
        document.getElementById('selectAllBtn').style.display = 'block';
        document.getElementById('selectAllBtn').textContent = (checked.length === total.length) ? 'إلغاء الكل' : 'تحديد الكل';
    } else {
        document.getElementById('selectAllBtn').style.display = 'none';
    }
}

function deleteSelectedProducts() {
    const checked = document.querySelectorAll('.product-checkbox:checked');
    if (checked.length === 0) return;
    showConfirm(`هل أنت متأكد من حذف الـ ${checked.length} منتجات المحددة؟`, () => {
        let ids = Array.from(checked).map(cb => Number(cb.getAttribute('data-id')));
        let products = getProducts().filter(p => !ids.includes(Number(p.id)));
        saveProducts(products);

        let updates = JSON.parse(localStorage.getItem('price_updates_list') || '[]').filter(u => !ids.includes(Number(u.productId)));
        localStorage.setItem('price_updates_list', JSON.stringify(updates));

        loadProducts();
        loadPriceUpdates();
        showToast("تم الحذف بنجاح!", false);
    });
}

function openProductModal(id) {
    const p = getProducts().find(item => item.id == id);
    if (!p) return;
    document.getElementById('modalImg').src = p.image || 'https://via.placeholder.com/130?text=No+Img';
    document.getElementById('modalName').textContent = p.name;
    document.getElementById('modalPrice').textContent = p.price + ' جنيه';
    document.getElementById('modalBarcode').textContent = 'الباركود: ' + p.barcode;
    document.getElementById('productModal').style.display = 'flex';
}

function openUpdateModal(updateId) {
    const updates = JSON.parse(localStorage.getItem('price_updates_list') || '[]');
    const u = updates.find(item => item.updateId == updateId);
    if (!u) return;
    document.getElementById('modalImg').src = u.image || 'https://via.placeholder.com/130?text=No+Img';
    document.getElementById('modalName').textContent = u.name;
    document.getElementById('modalPrice').innerHTML = `<span style="text-decoration: line-through; color: #ef4444; margin-left: 10px;">${u.oldPrice} ج.م</span> <span style="color: #10b981; font-weight: 900; font-size: 22px;">${u.price} ج.م</span>`;
    document.getElementById('modalBarcode').textContent = 'الباركود: ' + u.barcode;
    document.getElementById('productModal').style.display = 'flex';
}

function closeProductModal() { document.getElementById('productModal').style.display = 'none'; }

function loadPriceUpdates() {
    const list = document.getElementById('updatesList');
    const updates = JSON.parse(localStorage.getItem('price_updates_list') || '[]');
    if (updates.length === 0) {
        list.innerHTML = '<p style="color: var(--text-muted); padding: 20px; text-align: center;">لا توجد تعديلات على الأسعار حتى الآن.</p>';
        return;
    }
    let html = '';
    updates.forEach(u => {
        html += `
            <div class="product-card" onclick="openUpdateModal(${u.updateId})">
                <img src="${u.image || 'https://via.placeholder.com/50?text=No+Img'}" class="product-thumb">
                <div class="product-info">
                    <h4>${u.name}</h4>
                    <p style="margin:0; font-size:14px;">السابق: <span style="text-decoration: line-through; color: #ef4444;">${u.oldPrice} ج.م</span> ⬅️ الجديد: <strong style="color: #10b981;">${u.price} ج.م</strong></p>
                </div>
                <div class="actions-group" onclick="event.stopPropagation()">
                    <button class="btn-delete" onclick="deleteSingleUpdate(${u.updateId})">حذف</button>
                </div>
            </div>
        `;
    });
    list.innerHTML = html;
}

function deleteSingleUpdate(updateId) {
    showConfirm("هل أنت متأكد من حذف هذا السجل؟", () => {
        let updates = JSON.parse(localStorage.getItem('price_updates_list') || '[]').filter(u => u.updateId !== Number(updateId));
        localStorage.setItem('price_updates_list', JSON.stringify(updates));
        loadPriceUpdates();
        showToast("تم الحذف بنجاح!", false);
    });
}

function updateImageFileName(input) {
    if (input.files && input.files[0]) {
        document.getElementById('imageFileName').textContent = "تم اختيار الصورة: " + input.files[0].name;
        showToast('تم اختيار الصورة بنجاح!');
    }
}

// محرك الكاميرا والباركود الحديث باستخدام Html5Qrcode
let activeScanner = null;
function toggleScanner(elementId, inputTargetId, isSearch = false) {
    const vp = document.getElementById(elementId);
    
    if (activeScanner) {
        activeScanner.stop().then(() => {
            activeScanner = null;
            vp.style.display = 'none';
        }).catch(err => {
            activeScanner = null;
            vp.style.display = 'none';
        });
        return;
    }

    vp.style.display = 'block';
    activeScanner = new Html5Qrcode(elementId);
    
    const config = { fps: 10, qrbox: { width: 250, height: 150 } };
    
    activeScanner.start(
        { facingMode: "environment" }, 
        config, 
        (decodedText) => {
            document.getElementById(inputTargetId).value = decodedText;
            if (isSearch) {
                searchProducts();
            }
            activeScanner.stop().then(() => {
                activeScanner = null;
                vp.style.display = 'none';
            });
            showToast('تم قراءة الرمز بنجاح!');
        },
        (errorMessage) => {
            // أخطاء المسح المؤقتة نتجاهلها عشان ماتعملش ازعاج في الكونسول
        }
    ).catch(err => {
        showToast('تعذر تشغيل الكاميرا، تأكد من الصلاحيات!', false);
        vp.style.display = 'none';
        activeScanner = null;
    });
}

function stopCurrentScanner() {
    if (activeScanner) {
        activeScanner.stop().then(() => {
            activeScanner = null;
            document.getElementById('reader').style.display = 'none';
            document.getElementById('searchReader').style.display = 'none';
        }).catch(e => {
            activeScanner = null;
        });
    }
}
</script>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2980b9">
    <title>لوحة تحكم المنتجات - إدارة الأسعار</title>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">

    <!-- Firebase 8: لازم تحميل Firebase قبل ملف JavaScript -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <!-- قارئ QR / Barcode: تم حذف التكرار الموجود في النسخة القديمة -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>

<body>
<div class="container">

    <button type="button" class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" aria-label="تغيير الوضع">
        🌙
    </button>

    <h2>لوحة تحكم المنتجات</h2>

    <div id="connectionStatus" class="connection-status" aria-live="polite"></div>

    <div class="tabs">
        <button type="button" class="tab-btn active" onclick="switchTab('add')">إضافة منتج جديد</button>
        <button type="button" class="tab-btn" onclick="switchTab('search')">استعلام شامل</button>
        <button type="button" class="tab-btn" onclick="switchTab('updates')">الأسعار الجديدة 🔔</button>
    </div>

    <!-- قسم الإضافة والتعديل -->
    <div id="addSection" class="section-content active">
        <input type="hidden" id="editingId" value="">

        <div class="form-group">
            <label for="productName">اسم المنتج</label>
            <input type="text" id="productName" placeholder="أدخل اسم المنتج هنا..." autocomplete="off">
        </div>

        <div class="form-group">
            <label for="productPrice">السعر (بالجنيه)</label>
            <input type="number" id="productPrice" placeholder="أدخل السعر..." min="0" step="0.01" inputmode="decimal">
        </div>

        <div class="form-group">
            <label for="productImage">رفع صورة المنتج</label>
            <div class="image-picker-row">
                <input type="file" id="productImage" accept="image/*" capture="environment"
                       style="display:none;" onchange="updateImageFileName(this)">
                <button type="button" class="btn-qr-scan image-picker-btn"
                        onclick="document.getElementById('productImage').click()">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M4 5h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm8 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0-2a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>
                    </svg>
                    اختر أو التقط صورة المنتج
                </button>
            </div>
            <div id="imageFileName" class="file-name"></div>
        </div>

        <div class="form-group">
            <label for="productBarcode">الباركود أو الـ QR Code</label>
            <div class="barcode-container">
                <input type="text" id="productBarcode" placeholder="امسح الرمز أو اكتبه..." autocomplete="off">
                <button type="button" class="btn-qr-scan" onclick="toggleScanner('reader', 'productBarcode')">
                    <svg viewBox="0 0 24 24">
                        <path d="M2,2H10V10H2V2M4,4V8H8V4H4M14,2H22V10H14V2M16,4V8H20V4H16M2,14H10V22H2V14M4,16V20H8V16H4M18,14V18H22V14H18M14,18H16V22H14V18M20,18H22V22H20V18M12,2H14V6H12V2M12,8H14V12H12V8M12,14H14V18H12V14M12,20H14V22H12V20M6,6H6.01V6.01H6V6M18,6H18.01V6.01H18V6M6,18H6.01V6.01H6V18Z"/>
                    </svg>
                    QR Scan
                </button>
            </div>
        </div>

        <div id="reader" class="viewport"></div>

        <button type="button" class="btn-save" id="saveProductBtn" onclick="saveProduct()">
            حفظ المنتج
        </button>
    </div>

    <!-- سجل الأسعار الجديدة -->
    <div id="updatesSection" class="section-content">
        <h3 class="section-title">سجل آخر تعديلات وتغيرات الأسعار</h3>
        <div id="updatesList" class="updates-list"></div>
    </div>

    <!-- الاستعلام الشامل -->
    <div id="searchSection" class="section-content">
        <div class="stats-grid">
            <div class="stat-card">
                <span>إجمالي المنتجات</span>
                <strong id="statTotal">0</strong>
            </div>
            <div class="stat-card">
                <span>أعلى سعر</span>
                <strong id="statMax">0 ج.م</strong>
            </div>
        </div>

        <div class="floating-actions">
            <button type="button" id="selectAllBtn" class="btn-select-all" onclick="toggleSelectAll()">تحديد الكل</button>
            <button type="button" id="deleteSelectedBtn" class="btn-delete-selected" onclick="deleteSelectedProducts()">حذف المحددين</button>
        </div>

        <div class="form-group">
            <label for="searchInput">ابحث بالاسم، السعر، أو الـ QR Code</label>
            <div class="barcode-container">
                <input type="text" id="searchInput" placeholder="ابحث عن منتجات..." oninput="searchProducts()" autocomplete="off">
                <button type="button" class="btn-qr-scan" onclick="toggleScanner('searchReader', 'searchInput', true)">
                    <svg viewBox="0 0 24 24">
                        <path d="M2,2H10V10H2V2M4,4V8H8V4H4M14,2H22V10H14V2M16,4V8H20V4H16M2,14H10V22H2V14M4,16V20H8V16H4M18,14V18H22V14H18M14,18H16V22H14V18M20,18H22V22H20V18M12,2H14V6H12V2M12,8H14V12H12V8M12,14H14V18H12V14M12,20H14V22H12V20M6,6H6.01V6.01H6V6M18,6H18.01V6.01H18V6M6,18H6.01V6.01H6V18Z"/>
                    </svg>
                    QR Scan
                </button>
            </div>
        </div>

        <div id="searchReader" class="viewport"></div>
        <div id="resultsList"></div>
    </div>
</div>

<!-- Modal التأكيد -->
<div id="confirmModal" class="modal" onclick="closeConfirmModal()">
    <div class="modal-content confirm-content" onclick="event.stopPropagation()">
        <h3 class="confirm-title">تأكيد الحذف</h3>
        <p id="confirmMessage" class="confirm-message"></p>
        <div class="modal-buttons">
            <button type="button" id="confirmYesBtn" class="confirm-delete-btn">نعم، حذف</button>
            <button type="button" onclick="closeConfirmModal()" class="confirm-cancel-btn">إلغاء</button>
        </div>
    </div>
</div>

<!-- Modal عرض التفاصيل -->
<div id="productModal" class="modal" onclick="closeProductModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-modal" onclick="closeProductModal()">&times;</span>
        <img id="modalImg" class="modal-img" src="" alt="صورة المنتج">
        <h3 id="modalName" class="modal-name"></h3>
        <div id="modalPrice" class="modal-price"></div>
        <div id="modalBarcode" class="modal-barcode"></div>
    </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="login.js"></script>
</body>
</html>
